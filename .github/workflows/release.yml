name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: x86_64 Linux (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Verify static linking
        run: |
          file target/x86_64-unknown-linux-musl/release/scr
          file target/x86_64-unknown-linux-musl/release/scr | grep -q "statically linked\|static-pie linked"

      - name: Package
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          name="scr-${version}-x86_64-unknown-linux-musl"
          mkdir -p "dist/${name}"
          install -m755 target/x86_64-unknown-linux-musl/release/scr "dist/${name}/scr"
          cp README.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          ls -l dist

      - name: Attach package to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
