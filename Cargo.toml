[package]
name = "scr"
version = "0.1.0"
edition = "2024"
description = "A lightweight, detachable GNU Screen replacement with a modern grayscale UI"
default-run = "scr"

[[bin]]
name = "scr"
path = "src/main.rs"

[[bin]]
name = "scr-guard"
path = "src/bin/scr-guard.rs"

[dependencies]
ratatui = "=0.30.2"
portable-pty = "=0.9.0"
vt100 = "=0.16.2"
tui-term = "=0.3.4"
anyhow = "1"
dirs = "5"
rustix = { version = "1", features = ["termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
