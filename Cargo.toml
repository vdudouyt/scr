[package]
name = "scr"
version = "0.1.0"
edition = "2024"
description = "A lightweight, detachable GNU Screen replacement with a Turbo Vision UI"

[[bin]]
name = "scr"
path = "src/main.rs"

[dependencies]
ratatui = "=0.30.2"
portable-pty = "=0.9.0"
vt100 = "=0.16.2"
tui-term = "=0.3.4"
anyhow = "1"
dirs = "5"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
